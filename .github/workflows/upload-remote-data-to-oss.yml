name: Upload remote data to OSS

on:
  push:
    branches:
      - main
    paths:
      - "remote_data/*.json"
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload JSON files
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          python3 - <<'PY'
          import base64
          import email.utils
          import hashlib
          import hmac
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          access_key_id = os.environ["ALIYUN_ACCESS_KEY_ID"]
          access_key_secret = os.environ["ALIYUN_ACCESS_KEY_SECRET"]
          bucket = "zjcs-tools-otori-database"
          endpoint = "oss-cn-shanghai.aliyuncs.com"
          content_type = "application/json"

          files = [
              ("remote_data/DHM_codes.json", "DHM_codes.json"),
              ("remote_data/XQF_Announcements.json", "XQF_Announcements.json"),
              ("remote_data/ZSF_Announcements.json", "ZSF_Announcements.json"),
              ("remote_data/app_update.json", "app_update.json"),
              ("remote_data/app_config.json", "app_config.json"),
              ("remote_data/dungeon_details.json", "dungeon_details.json"),
              ("remote_data/monster_details.json", "monster_details.json"),
          ]

          def upload(local_path, object_name):
              data = pathlib.Path(local_path).read_bytes()
              content_md5 = base64.b64encode(hashlib.md5(data).digest()).decode()
              date = email.utils.formatdate(usegmt=True)
              canonical_resource = f"/{bucket}/{object_name}"
              string_to_sign = f"PUT\n{content_md5}\n{content_type}\n{date}\n{canonical_resource}"
              signature = base64.b64encode(
                  hmac.new(
                      access_key_secret.encode(),
                      string_to_sign.encode(),
                      hashlib.sha1,
                  ).digest()
              ).decode()

              url = f"https://{bucket}.{endpoint}/{urllib.parse.quote(object_name)}"
              request = urllib.request.Request(
                  url,
                  data=data,
                  method="PUT",
                  headers={
                      "Authorization": f"OSS {access_key_id}:{signature}",
                      "Content-MD5": content_md5,
                      "Content-Type": content_type,
                      "Date": date,
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status // 100 != 2:
                          raise RuntimeError(f"Unexpected HTTP status {response.status}")
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  print(body, file=sys.stderr)
                  raise

              print(f"Uploaded {local_path} -> oss://{bucket}/{object_name}")

          for local_path, object_name in files:
              upload(local_path, object_name)
          PY
